<!DOCTYPE html>
<html lang="id" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Armada - Wasman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {"50":"#ecfdf5","100":"#d1fae5","200":"#a7f3d0","300":"#6ee7b7","400":"#34d399","500":"#10b981","600":"#059669","700":"#047857","800":"#065f46","900":"#064e3b"} } } } }
    </script>
</head>
<body class="h-full overflow-y-auto bg-gray-50" x-data="{ menuOpen: false, modalOpen: false }">
    
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
        <div class="flex items-center px-4 h-14 md:px-6 md:h-16 gap-3">
            <a href="dashboard.html" class="p-2 -ml-2 text-gray-500 md:hidden"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg md:text-xl">Armada</h1>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto space-y-6 pb-24 md:pb-6">
        
        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 md:gap-4">
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Total</p>
                <p class="text-2xl font-bold text-gray-900">5</p>
            </div>
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Aktif</p>
                <p class="text-2xl font-bold text-primary-600">4</p>
            </div>
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Tidak Aktif</p>
                <p class="text-2xl font-bold text-gray-400">1</p>
            </div>
        </div>

        <div class="flex justify-between items-center">
            <h2 class="font-bold text-gray-900">Daftar Kendaraan</h2>
            <button @click="modalOpen = true" class="bg-primary-500 hover:bg-primary-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium">
                <i class="fas fa-plus mr-1"></i> Tambah
            </button>
        </div>

        <!-- Grid Armada -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Item 1 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex gap-4 items-center">
                <div class="w-14 h-14 bg-blue-50 rounded-lg flex items-center justify-center text-blue-500 flex-shrink-0">
                    <i class="fas fa-truck-pickup text-2xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-gray-900 truncate">B 1234 XYZ</h3>
                    <p class="text-sm text-gray-500">Mobil Pickup • 500kg</p>
                    <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-medium bg-green-100 text-green-700">Aktif</span>
                </div>
                <button class="p-2 text-gray-400 hover:text-gray-700"><i class="fas fa-ellipsis-v"></i></button>
            </div>
            <!-- Item 2 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex gap-4 items-center">
                <div class="w-14 h-14 bg-orange-50 rounded-lg flex items-center justify-center text-orange-500 flex-shrink-0">
                    <i class="fas fa-motorcycle text-2xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-gray-900 truncate">B 5678 ABC</h3>
                    <p class="text-sm text-gray-500">Motor Gerobak • 150kg</p>
                    <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-medium bg-green-100 text-green-700">Aktif</span>
                </div>
                <button class="p-2 text-gray-400 hover:text-gray-700"><i class="fas fa-ellipsis-v"></i></button>
            </div>
            <!-- Item 3 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex gap-4 items-center opacity-75">
                <div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 flex-shrink-0">
                    <i class="fas fa-truck text-2xl"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-bold text-gray-900 truncate">B 9999 DEF</h3>
                    <p class="text-sm text-gray-500">Truk • 2000kg</p>
                    <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-medium bg-gray-100 text-gray-600">Tidak Aktif (Servis)</span>
                </div>
                <button class="p-2 text-gray-400 hover:text-gray-700"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>

    </main>

    <!-- Modal Form -->
    <div x-show="modalOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4" x-cloak>
        <div class="absolute inset-0 bg-gray-900/50" @click="modalOpen = false"></div>
        <div class="relative bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-lg text-gray-900">Tambah Kendaraan</h3>
                <button @click="modalOpen = false" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Polisi</label>
                    <input type="text" class="w-full p-2 border border-gray-300 rounded-lg text-sm" placeholder="Contoh: B 1234 XYZ">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kendaraan</label>
                    <select class="w-full p-2 border border-gray-300 rounded-lg text-sm">
                        <option>Motor Gerobak</option>
                        <option>Mobil Pickup</option>
                        <option>Truk</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Kapasitas (kg)</label>
                    <input type="number" class="w-full p-2 border border-gray-300 rounded-lg text-sm" placeholder="Contoh: 500">
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-2">
                <button @click="modalOpen = false" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">Batal</button>
                <button class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700">Simpan</button>
            </div>
        </div>
    </div>
</body>
</html>
