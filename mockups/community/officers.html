<!DOCTYPE html>
<html lang="id" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petugas Komunitas - Wasman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {"50":"#ecfdf5","100":"#d1fae5","200":"#a7f3d0","300":"#6ee7b7","400":"#34d399","500":"#10b981","600":"#059669","700":"#047857","800":"#065f46","900":"#064e3b"} } } } }
    </script>
</head>
<body class="h-full overflow-y-auto bg-gray-50" x-data="{ search: '' }">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
        <div class="flex items-center px-4 h-14 md:px-6 md:h-16 gap-3">
            <a href="dashboard.html" class="p-2 -ml-2 text-gray-500 md:hidden"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg md:text-xl">Petugas</h1>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-7xl mx-auto space-y-6 pb-24 md:pb-6">
        
        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 md:gap-4">
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Total</p>
                <p class="text-2xl font-bold text-gray-900">12</p>
            </div>
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Aktif</p>
                <p class="text-2xl font-bold text-primary-600">10</p>
            </div>
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs md:text-sm text-gray-500 mb-1">Tugas Hari Ini</p>
                <p class="text-2xl font-bold text-indigo-600">6</p>
            </div>
        </div>

        <!-- Search & Add -->
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" x-model="search" placeholder="Cari nama petugas..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
            </div>
            <button class="bg-primary-500 hover:bg-primary-600 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center">
                <i class="fas fa-plus"></i> <span class="hidden md:inline ml-2">Tambah</span>
            </button>
        </div>

        <!-- Grid Petugas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Officer 1 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col items-center text-center relative">
                <div class="absolute top-3 right-3"><span class="flex h-3 w-3 relative"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span></span></div>
                <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-xl font-bold text-gray-600 mb-3">AH</div>
                <h3 class="font-bold text-gray-900">Ahmad Hidayat</h3>
                <p class="text-sm text-gray-500 mb-2">0812-3456-7891</p>
                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-bold rounded mb-4">Petugas Lapangan</span>
                
                <div class="flex w-full border-t border-gray-100 pt-3 justify-between px-2 text-sm">
                    <div class="text-center"><p class="font-bold text-gray-800">145</p><p class="text-xs text-gray-500">Angkutan</p></div>
                    <div class="text-center"><p class="font-bold text-gray-800">4.8 <i class="fas fa-star text-yellow-400 text-xs"></i></p><p class="text-xs text-gray-500">Rating</p></div>
                </div>
            </div>

            <!-- Officer 2 -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex flex-col items-center text-center relative">
                <div class="absolute top-3 right-3"><span class="h-3 w-3 bg-gray-400 rounded-full inline-block"></span></div>
                <div class="w-16 h-16 bg-gray-200 rounded-full flex items-center justify-center text-xl font-bold text-gray-600 mb-3">DL</div>
                <h3 class="font-bold text-gray-900">Dewi Lestari</h3>
                <p class="text-sm text-gray-500 mb-2">0812-3456-7892</p>
                <span class="px-2 py-0.5 bg-purple-100 text-purple-700 text-xs font-bold rounded mb-4">Admin/Petugas</span>
                
                <div class="flex w-full border-t border-gray-100 pt-3 justify-between px-2 text-sm">
                    <div class="text-center"><p class="font-bold text-gray-800">89</p><p class="text-xs text-gray-500">Angkutan</p></div>
                    <div class="text-center"><p class="font-bold text-gray-800">4.9 <i class="fas fa-star text-yellow-400 text-xs"></i></p><p class="text-xs text-gray-500">Rating</p></div>
                </div>
            </div>
        </div>

    </main>
    <!-- Floating Back to Mockup Index Button -->
    <a href="../index.html" class="fixed bottom-4 md:bottom-6 right-4 md:right-6 z-50 bg-gray-900/90 hover:bg-black text-white text-xs font-semibold px-3.5 py-2.5 rounded-full shadow-xl backdrop-blur-sm flex items-center gap-2 border border-white/20 transition-all hover:scale-105 group" title="Kembali ke Menu Mockup">
        <i class="fas fa-th-large text-emerald-400 group-hover:rotate-90 transition-transform duration-300"></i>
        <span>Menu Mockup</span>
    </a>
</body>
</html>
