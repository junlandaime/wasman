<!DOCTYPE html>
<html lang="id" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permintaan Angkut - Wasman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {"50":"#ecfdf5","100":"#d1fae5","200":"#a7f3d0","300":"#6ee7b7","400":"#34d399","500":"#10b981","600":"#059669","700":"#047857","800":"#065f46","900":"#064e3b"} } } } }
    </script>
    <style>[x-cloak] { display: none !important; } .bottom-nav-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
</head>
<body class="h-full overflow-hidden flex bg-gray-50" x-data="{ menuOpen: false, activeTab: 'menunggu' }">
    <!-- Desktop Sidebar (Omitted for brevity, assume similar to dashboard) -->
    
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Mobile Header -->
        <header class="md:hidden bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
            <div class="flex items-center justify-between px-4 h-14">
                <a href="dashboard.html" class="flex items-center gap-2" title="Kembali ke Dashboard">
                    <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-recycle text-white text-sm"></i>
                    </div>
                    <span class="font-bold text-gray-800 text-lg">Wasman</span>
                </a>
            </div>
        </header>

        <!-- Desktop Header -->
        <header class="hidden md:flex h-16 bg-white border-b border-gray-200 items-center justify-between px-6 z-10">
            <h1 class="text-xl font-semibold text-gray-800">Permintaan Angkut</h1>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 md:pb-6">
            <div class="max-w-7xl mx-auto space-y-6">
                <!-- Search & Filter -->
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Cari nama RT atau kode..." class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 outline-none">
                    </div>
                    <button class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg border border-gray-200">
                        <i class="fas fa-filter"></i>
                    </button>
                </div>

                <!-- Tabs -->
                <div class="flex overflow-x-auto pb-2 border-b border-gray-200 gap-6 no-scrollbar">
                    <button @click="activeTab = 'menunggu'" :class="activeTab === 'menunggu' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500'" class="whitespace-nowrap border-b-2 py-2 text-sm font-medium">Menunggu (2)</button>
                    <button @click="activeTab = 'dijadwalkan'" :class="activeTab === 'dijadwalkan' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500'" class="whitespace-nowrap border-b-2 py-2 text-sm font-medium">Dijadwalkan (3)</button>
                    <button @click="activeTab = 'proses'" :class="activeTab === 'proses' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500'" class="whitespace-nowrap border-b-2 py-2 text-sm font-medium">Dalam Proses (1)</button>
                    <button @click="activeTab = 'selesai'" :class="activeTab === 'selesai' ? 'border-primary-500 text-primary-600' : 'border-transparent text-gray-500'" class="whitespace-nowrap border-b-2 py-2 text-sm font-medium">Selesai</button>
                </div>

                <!-- List -->
                <div class="space-y-4">
                    <!-- Item 1 (Menunggu) -->
                    <div x-show="activeTab === 'menunggu'" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold text-gray-400">#REQ-20260919-01</span>
                                <h3 class="font-bold text-gray-900 mt-1">Budi Santoso</h3>
                            </div>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700">Menunggu Approval</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div class="text-sm">
                                <p class="text-gray-500 text-xs">Jenis Sampah</p>
                                <p class="font-medium text-gray-800">Plastik, Kertas</p>
                            </div>
                            <div class="text-sm">
                                <p class="text-gray-500 text-xs">Estimasi Berat</p>
                                <p class="font-medium text-gray-800">~5 kg</p>
                            </div>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-gray-100">
                            <button class="flex-1 bg-primary-600 text-white text-sm font-medium py-1.5 rounded-lg">Setujui</button>
                            <button class="flex-1 bg-white border border-gray-300 text-gray-700 text-sm font-medium py-1.5 rounded-lg">Tolak</button>
                            <a href="collections-show.html" class="flex-none px-3 bg-gray-100 text-gray-600 flex items-center justify-center rounded-lg">
                                <i class="fas fa-chevron-right text-xs"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Item 2 (Dijadwalkan) -->
                    <div x-show="activeTab === 'dijadwalkan'" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold text-gray-400">#REQ-20260918-05</span>
                                <h3 class="font-bold text-gray-900 mt-1">Siti Nurhaliza</h3>
                            </div>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-indigo-50 text-indigo-700">Dijadwalkan</span>
                        </div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-[10px] font-bold">AH</div>
                            <span class="text-xs text-gray-600">Ahmad Hidayat (Besok, 08:00)</span>
                        </div>
                        <div class="flex gap-2 pt-3 border-t border-gray-100">
                            <button class="flex-1 bg-white border border-gray-300 text-gray-700 text-sm font-medium py-1.5 rounded-lg">Ubah Petugas</button>
                            <a href="collections-show.html" class="flex-1 bg-gray-100 text-gray-700 text-sm font-medium py-1.5 rounded-lg text-center">Detail</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 bottom-nav-safe z-40">
        <div class="flex justify-around items-center h-16">
            <a href="dashboard.html" class="flex flex-col items-center justify-center w-full h-full text-gray-500">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </a>
            <a href="tasks.html" class="flex flex-col items-center justify-center w-full h-full text-gray-500">
                <i class="fas fa-clipboard-list text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Tugas</span>
            </a>
            <a href="collections-index.html" class="flex flex-col items-center justify-center w-full h-full text-primary-600">
                <i class="fas fa-truck text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Angkut</span>
            </a>
            <a href="schedules-index.html" class="flex flex-col items-center justify-center w-full h-full text-gray-500">
                <i class="fas fa-calendar text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Jadwal</span>
            </a>
            <button @click="menuOpen = true" class="flex flex-col items-center justify-center w-full h-full text-gray-500">
                <i class="fas fa-bars text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Menu</span>
            </button>
        </div>
    </nav>
    
    <div x-show="menuOpen" class="md:hidden relative z-50" x-cloak>
        <div class="fixed inset-0 bg-gray-900/50" @click="menuOpen = false"></div>
        <div class="fixed bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-xl p-4 bottom-nav-safe">
            <div class="flex justify-between items-center mb-4"><h3 class="font-bold">Menu</h3><button @click="menuOpen=false"><i class="fas fa-times"></i></button></div>
            <div class="grid grid-cols-3 gap-4">
                <a href="fleet.html" class="text-center text-sm">Armada</a>
                <a href="officers.html" class="text-center text-sm">Petugas</a>
                <a href="service-areas.html" class="text-center text-sm">Wilayah</a>
                <a href="households.html" class="text-center text-sm">Rumah Tangga</a>
            </div>
        </div>
    </div>
</body>
</html>
