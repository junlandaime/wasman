<!DOCTYPE html>
<html lang="id" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Jadwal Reguler Baru - Wasman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {"50":"#ecfdf5","100":"#d1fae5","200":"#a7f3d0","300":"#6ee7b7","400":"#34d399","500":"#10b981","600":"#059669","700":"#047857","800":"#065f46","900":"#064e3b"} } } } }
    </script>
</head>
<body class="h-full overflow-y-auto bg-gray-50 pb-20 md:pb-0" x-data="{ selectedDays: ['sen'] }">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
        <div class="flex items-center px-4 h-14 gap-3">
            <a href="schedules-index.html" class="p-2 -ml-2 text-gray-500"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg">Buat Jadwal Baru</h1>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-3xl mx-auto space-y-6">
        <form class="space-y-6">
            <!-- Wilayah Layanan -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label class="block text-sm font-semibold text-gray-800 mb-2">Wilayah Layanan</label>
                <select class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-primary-500 outline-none">
                    <option disabled selected>Pilih wilayah layanan...</option>
                    <option>RW 01-02 Kel. Sukamaju</option>
                    <option>RW 03 Kel. Sukamaju</option>
                </select>
            </div>

            <!-- Jenis Sampah -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label class="block text-sm font-semibold text-gray-800 mb-2">Jenis Sampah yang Diangkut</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" class="rounded text-primary-500 focus:ring-primary-500" checked>
                        <span class="text-sm font-medium text-gray-700">Organik</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" class="rounded text-primary-500 focus:ring-primary-500" checked>
                        <span class="text-sm font-medium text-gray-700">Anorganik</span>
                    </label>
                </div>
            </div>

            <!-- Waktu & Hari -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-800 mb-2">Pilih Hari</label>
                    <div class="flex gap-2 flex-wrap">
                        <button type="button" @click="selectedDays.includes('sen') ? selectedDays = selectedDays.filter(d => d !== 'sen') : selectedDays.push('sen')" 
                                :class="selectedDays.includes('sen') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Sen</button>
                        <button type="button" @click="selectedDays.includes('sel') ? selectedDays = selectedDays.filter(d => d !== 'sel') : selectedDays.push('sel')" 
                                :class="selectedDays.includes('sel') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Sel</button>
                        <button type="button" @click="selectedDays.includes('rab') ? selectedDays = selectedDays.filter(d => d !== 'rab') : selectedDays.push('rab')" 
                                :class="selectedDays.includes('rab') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Rab</button>
                        <button type="button" @click="selectedDays.includes('kam') ? selectedDays = selectedDays.filter(d => d !== 'kam') : selectedDays.push('kam')" 
                                :class="selectedDays.includes('kam') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Kam</button>
                        <button type="button" @click="selectedDays.includes('jum') ? selectedDays = selectedDays.filter(d => d !== 'jum') : selectedDays.push('jum')" 
                                :class="selectedDays.includes('jum') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Jum</button>
                        <button type="button" @click="selectedDays.includes('sab') ? selectedDays = selectedDays.filter(d => d !== 'sab') : selectedDays.push('sab')" 
                                :class="selectedDays.includes('sab') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Sab</button>
                        <button type="button" @click="selectedDays.includes('min') ? selectedDays = selectedDays.filter(d => d !== 'min') : selectedDays.push('min')" 
                                :class="selectedDays.includes('min') ? 'bg-primary-500 text-white border-primary-500' : 'bg-white text-gray-600 border-gray-300'" 
                                class="w-10 h-10 rounded-full border text-sm font-medium transition-colors">Min</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Jam Mulai</label>
                        <input type="time" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white" value="08:00">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Jam Selesai</label>
                        <input type="time" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white" value="12:00">
                    </div>
                </div>
            </div>

            <!-- Rentang Waktu -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Berlaku Mulai</label>
                        <input type="date" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-2">Sampai (Opsional)</label>
                        <input type="date" class="w-full p-3 border border-gray-300 rounded-lg text-sm bg-white">
                    </div>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 z-20">
                <button type="button" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-colors">
                    Simpan Jadwal
                </button>
            </div>
        </form>
    </main>
    <!-- Floating Back to Mockup Index Button -->
    <a href="../index.html" class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-50 bg-gray-900/90 hover:bg-black text-white text-xs font-semibold px-3.5 py-2.5 rounded-full shadow-xl backdrop-blur-sm flex items-center gap-2 border border-white/20 transition-all hover:scale-105 group" title="Kembali ke Menu Mockup">
        <i class="fas fa-th-large text-emerald-400 group-hover:rotate-90 transition-transform duration-300"></i>
        <span>Menu Mockup</span>
    </a>
</body>
</html>
